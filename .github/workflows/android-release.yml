```yaml
name: Auto Bidder - Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      NODE_ENV: production
      EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
      NODE_OPTIONS: --max-old-space-size=4096
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # --------------------------------------------------
      # Java
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # --------------------------------------------------
      # Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.1.10909125"

      # --------------------------------------------------
      # Install JavaScript dependencies
      #
      # npm install is intentional here.
      # It prevents CI from stopping because package-lock
      # and package.json are slightly out of sync.
      # --------------------------------------------------
      - name: Install npm dependencies
        run: npm install --include=dev

      # --------------------------------------------------
      # Verify patch-package
      # --------------------------------------------------
      - name: Verify patch-package
        run: |
          echo "Checking patch-package..."
          npx patch-package --version

      # --------------------------------------------------
      # Verify Expo
      # --------------------------------------------------
      - name: Verify Expo environment
        run: |
          node --version
          npm --version
          npx expo --version

      # --------------------------------------------------
      # Generate Android native project
      # --------------------------------------------------
      - name: Generate Android project
        working-directory: apps/mobile
        run: |
          npx expo prebuild \
            --platform android \
            --clean \
            --non-interactive

      # --------------------------------------------------
      # Verify Android project
      # --------------------------------------------------
      - name: Verify Android project
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew

          test -f gradlew
          test -d app

          ./gradlew --version

      # --------------------------------------------------
      # Clean
      # --------------------------------------------------
      - name: Clean Android build
        working-directory: apps/mobile/android
        run: |
          ./gradlew clean \
            --no-daemon \
            --max-workers=2 \
            --stacktrace

      # --------------------------------------------------
      # Build Release APK
      # --------------------------------------------------
      - name: Build Release APK
        working-directory: apps/mobile/android
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --max-workers=2 \
            --stacktrace \
            --warning-mode=all

      # --------------------------------------------------
      # Verify APK
      # --------------------------------------------------
      - name: Verify APK
        run: |
          APK="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK"

      # --------------------------------------------------
      # Upload APK
      # --------------------------------------------------
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-bidder-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
```
