name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Repo checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Node setup (React Native / Expo projects ke liye)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Dependencies install
      - name: Install dependencies
        run: npm install

      # 4. ===== YE MOST IMPORTANT STEP HAI =====
      # Repo Secrets se .env file banao BUILD SE PEHLE
      - name: Create .env file
        run: |
          echo "API_URL=${{ secrets.API_URL }}" >> .env
          echo "FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}" >> .env
          echo "FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}" >> .env
          echo "APP_ENV=production" >> .env
          cat .env

      # 5. Java setup (Android build ke liye required)
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 6. Android build tools setup
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 7. Gradle ko executable banao
      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # 8. APK build karo (.env values ab available hain)
      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      # 9. APK ko artifact ke roop mein upload karo taaki download kar sako
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk

# ============================================
# ZAROORI SETUP (workflow chalane se pehle):
# ============================================
# 1. GitHub repo > Settings > Secrets and variables > Actions
# 2. "New repository secret" click karke ye add karein:
#    - API_URL
#    - FIREBASE_API_KEY
#    - FIREBASE_PROJECT_ID
#    (jo bhi aapke .env mein variables hain, wahi naam use karein)
#
# 3. Apne app code mein check karein ki env vars kaise read
#    ho rahe hain (react-native-config, react-native-dotenv,
#    ya process.env). Framework ke hisaab se variable
#    naming convention different ho sakta hai:
#    - Expo:              EXPO_PUBLIC_API_URL
#    - react-native-config: sab .env mein as-is
#    - Vite/Web builds:    VITE_API_URL
#
# 4. Agar "Configuration - missing production env
#    variables" error abhi bhi aaye, toh app ke andar
#    us jagah check karein jahan ye validation ho rahi
#    hai (usually App.js / config.js / env.ts mein) aur
#    dekhein exactly kaunsa variable name expect kiya
#    ja raha hai — us naam se hi secret aur .env line
#    match honi chahiye.
