```yaml
name: Build Auto Bidder Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      GRADLE_OPTS: "-Xmx6144m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Check Environment
        run: |
          node --version
          npm --version
          java -version
          free -h

      - name: Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: Check Expo
        run: npx expo --version

      - name: Generate Android Project
        run: npx expo prebuild --platform android --no-install

      - name: Configure Gradle Memory
        run: |
          cat >> android/gradle.properties <<'EOF'

          org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          org.gradle.caching=true
          EOF

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Verify Gradle
        working-directory: android
        run: ./gradlew --version

      - name: Clean Android
        working-directory: android
        run: ./gradlew clean --no-daemon --max-workers=2

      - name: Build Release APK
        working-directory: android
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          ./gradlew assembleRelease \
            --no-daemon \
            --max-workers=2 \
            --stacktrace \
            --info

      - name: Verify APK
        run: |
          echo "APK files:"
          find android/app/build/outputs/apk/release -type f -name "*.apk" -print

          APK=$(find android/app/build/outputs/apk/release -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-bidder-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: auto-bidder-build-reports
          path: |
            android/build/reports/**
            android/app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
```
