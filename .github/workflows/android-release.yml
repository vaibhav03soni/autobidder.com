name: Auto Bidder Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"
          sdkmanager "ndk;26.1.10909125"

      - name: Install dependencies
        run: npm install --include=dev

      - name: Check patch-package
        run: npx patch-package --version

      - name: Check Expo
        run: npx expo --version

      - name: Generate Android
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean

      - name: Make Gradle executable
        working-directory: apps/mobile/android
        run: chmod +x gradlew

      - name: Clean Gradle
        working-directory: apps/mobile/android
        run: ./gradlew clean --no-daemon --max-workers=2

      - name: Build APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 --stacktrace

      - name: Check APK
        run: |
          test -f apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          ls -lh apps/mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-bidder-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
