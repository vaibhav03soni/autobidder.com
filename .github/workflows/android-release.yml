name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Repo checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Node setup
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Java setup (required for Android/Gradle build)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. IMPORTANT: Create .env file from GitHub Secrets
      # -> Yahi step "Configuration" wala error fix karega,
      #    kyunki app ko production env variables mil jayenge build ke time.
      # -> Repo Settings > Secrets and variables > Actions me ye 2 secrets add karo:
      #      EXPO_PUBLIC_API_BASE_URL
      #      EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY
      - name: Create .env file (apps/mobile)
        working-directory: apps/mobile
        run: |
          cat <<EOF > .env
          EXPO_PUBLIC_API_BASE_URL=${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
          EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          EOF
          echo ".env file created:"
          cat .env | sed 's/=.*/=****/'   # values ko hide karke print karo (safety)

      # 5. Clean install to avoid stale/duplicate package issues
      # NOTE: ye monorepo hai (apps/mobile, services/api), isliye root se
      #       npm ci chalao taaki workspaces sahi se install hon.
      - name: Install dependencies (clean)
        run: |
          rm -rf node_modules
          npm ci

      # 6. Clear stale native build caches (reanimated version mismatch fix)
      - name: Clear native build caches
        run: |
          rm -rf apps/mobile/node_modules/react-native-reanimated/android/.cxx
          rm -rf apps/mobile/android/app/.cxx
          rm -rf ~/.gradle/caches

      # 7. Make gradlew executable
      - name: Grant execute permission for gradlew
        working-directory: apps/mobile/android
        run: chmod +x gradlew

      # 8. Clean previous android build
      - name: Clean Android build
        working-directory: apps/mobile/android
        run: ./gradlew clean

      # 9. Build the release APK
      - name: Build APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      # 10. Upload APK as workflow artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
