name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    # environment: production   # <-- UNCOMMENT karo agar secrets kisi environment ke andar hain
    steps:
      # 1. Repo checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Node setup
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Java setup
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Create .env file from GitHub Secrets
      - name: Create .env file (apps/mobile)
        working-directory: apps/mobile
        run: |
          cat <<EOF > .env
          EXPO_PUBLIC_API_BASE_URL=${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
          EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          EOF

      # 5. VERIFY secrets actually loaded (fails build early if empty — better than silent APK failure)
      - name: Verify env values are not empty
        working-directory: apps/mobile
        run: |
          set -e
          if [ -z "${{ secrets.EXPO_PUBLIC_API_BASE_URL }}" ]; then
            echo "❌ EXPO_PUBLIC_API_BASE_URL is EMPTY — check repo secrets"
            exit 1
          fi
          if [ -z "${{ secrets.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}" ]; then
            echo "❌ EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY is EMPTY — check repo secrets"
            exit 1
          fi
          echo "✅ Both secrets present and non-empty"

      # 6. Clean install
      - name: Install dependencies (clean)
        run: |
          rm -rf node_modules
          npm ci

      # 7. Expo prebuild
      - name: Expo prebuild (generate android project)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean

      # 8. Clear stale native build caches
      - name: Clear native build caches
        run: |
          rm -rf apps/mobile/node_modules/react-native-reanimated/android/.cxx
          rm -rf apps/mobile/android/app/.cxx
          rm -rf ~/.gradle/caches

      # 9. Make gradlew executable
      - name: Grant execute permission for gradlew
        working-directory: apps/mobile/android
        run: chmod +x gradlew

      # 10. Clean previous android build
      - name: Clean Android build
        working-directory: apps/mobile/android
        run: ./gradlew clean

      # 11. Build release APK — env passed BOTH via .env AND shell env (belt-and-suspenders)
      - name: Build APK
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
          EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        run: ./gradlew assembleRelease --no-daemon

      # 12. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
