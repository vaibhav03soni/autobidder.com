name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Repo checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Node setup
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Java setup (required for Android/Gradle build)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. IMPORTANT: Create .env file from GitHub Secrets
      # -> Yahi step "Configuration" wala error fix karega,
      #    kyunki app ko production env variables mil jayenge build ke time.
      # -> Repo Settings > Secrets and variables > Actions me ye secrets add karo
      #    apne app ke actual variable names ke hisaab se.
      - name: Create .env file
        run: |
          cat <<EOF > .env
          API_URL=${{ secrets.API_URL }}
          APP_ENV=production
          FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EOF
          echo ".env file created:"
          cat .env | sed 's/=.*/=****/'   # values ko hide karke print karo (safety)

      # 5. Clean install to avoid stale/duplicate package issues
      - name: Install dependencies (clean)
        run: |
          rm -rf node_modules
          npm ci

      # 6. Clear stale native build caches (reanimated version mismatch fix)
      - name: Clear native build caches
        run: |
          rm -rf node_modules/react-native-reanimated/android/.cxx
          rm -rf android/app/.cxx
          rm -rf ~/.gradle/caches

      # 7. Make gradlew executable
      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # 8. Clean previous android build
      - name: Clean Android build
        run: |
          cd android
          ./gradlew clean

      # 9. Build the release APK
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      # 10. Upload APK as workflow artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
