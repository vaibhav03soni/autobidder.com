name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Repo checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Node setup
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Dependencies install
      - name: Install dependencies
        run: npm install

      # 4. ===== DIAGNOSTIC STEP: reanimated duplicate version check =====
      # Ye batayega agar reanimated ke multiple/conflicting versions
      # node_modules mein hain — jo aapke C++ build error ka root cause hai
      - name: Check for duplicate reanimated versions
        run: |
          echo "----- react-native-reanimated versions found -----"
          npm ls react-native-reanimated || true
          echo "----------------------------------------------------"

      # 5. ===== ENV FILE: sahi Expo naming convention ke saath =====
      # EXPO_PUBLIC_ prefix wale vars automatically JS bundle mein
      # baked ho jaate hain agar Expo/Metro use ho raha hai
      - name: Create .env file
        run: |
          echo "EXPO_PUBLIC_API_BASE_URL=${{ secrets.EXPO_PUBLIC_API_BASE_URL }}" >> .env
          echo "EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}" >> .env
          echo ".env file created with keys:"
          cat .env | sed 's/=.*/=[HIDDEN]/'

      # 6. Java setup
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 7. Android SDK setup
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 8. Gradle executable permission
      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # 9. Clean build cache (agar pichli run se corrupted CMake/Ninja cache bacha ho)
      - name: Clean previous native build cache
        run: |
          cd android
          ./gradlew clean
          rm -rf app/.cxx
          rm -rf ../node_modules/react-native-reanimated/android/.cxx

      # 10. APK build
      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      # 11. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk

# ============================================
# ZAROORI SETUP (workflow chalane se pehle):
# ============================================
# 1. GitHub Secrets already sahi hain (confirm ho chuka):
#    - EXPO_PUBLIC_API_BASE_URL
#    - EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY
#
# 2. REANIMATED BUILD ERROR FIX (root cause):
#    Aapke build log mein ye error tha:
#      "type constraint differs in template redeclaration"
#      "use of undeclared identifier 'getResolvableValueContext'"
#    Ye tab hota hai jab react-native-reanimated ke DO ALAG
#    versions node_modules mein exist karte hain (ek header file
#    purani hai, .cpp file nayi) - kisi dusre package (jaise koi
#    UI library) ne apna khud ka reanimated version bundle kar
#    rakha hai.
#
#    Step 4 (upar) ka output dekhein - agar "npm ls" mein
#    react-native-reanimated ke multiple version numbers dikhein,
#    to apne package.json mein ye add karein:
#
#    "overrides": {
#      "react-native-reanimated": "<aapka desired version>"
#    }
#
#    Phir commit karke workflow re-run karein.
#
# 3. Agar sirf ek version dikhta hai (no duplicate), to reanimated
#    ko RN/Expo SDK ke saath compatible version par upgrade/downgrade
#    karein - "npx expo install --check" command locally chalayein.
